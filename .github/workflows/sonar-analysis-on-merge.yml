name: Sonar Analysis on Merge
on:
  push:
    branches:
      - main

jobs:
  run-sonar-code-analysis:
    name: Run SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
      - name: Run alerts tests with coverage
        run: cd alerts && npm ci --ignore-scripts && npm run test:coverage
      - name: Run slack tests with coverage
        run: cd slack && npm ci --ignore-scripts && npm run test:coverage
      - name: Run heartbeat tests with coverage
        run: cd heartbeat && npm ci --ignore-scripts && npm run test:coverage
      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v7.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
