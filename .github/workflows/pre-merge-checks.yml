name: Pre-merge checks
on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check formatting
        run: npm run check-pretty
      - name: Build app
        run: npm run build
      - name: Run lint
        run: npm run lint
      - name: Run alerts tests
        run: cd alerts && npm ci --ignore-scripts && npm run test:coverage
      - name: Run slack tests
        run: cd slack && npm ci --ignore-scripts && npm run test:coverage
      - name: Run heartbeat tests
        run: cd heartbeat && npm ci --ignore-scripts && npm run test:coverage

  run-sonar-code-analysis:
    name: Run SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
      - name: Run alerts tests with coverage
        run: cd alerts && npm ci --ignore-scripts && npm run test:coverage
      - name: Run slack tests with coverage
        run: cd slack && npm ci --ignore-scripts && npm run test:coverage
      - name: Run heartbeat tests with coverage
        run: cd heartbeat && npm ci --ignore-scripts && npm run test:coverage
      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v7.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
